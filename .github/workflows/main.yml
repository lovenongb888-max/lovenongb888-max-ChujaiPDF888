import 'package:flutter/material.dart';

void main() {
  runApp(const MatkaApp());
}

class MatkaApp extends StatelessWidget {
  const MatkaApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Matka Gaming App',
      theme: ThemeData(
        primarySwatch: Colors.deepPurple,
        useMaterial3: true,
      ),
      home: const LoginScreen(),
    );
  }
}

// 1. LOGIN / ACCOUNT CREATION SCREEN
class LoginScreen extends StatefulWidget {
  const LoginScreen({super.key});

  @override
  State<LoginScreen> createState() => _LoginScreenState();
}

class _LoginScreenState extends State<LoginScreen> {
  final TextEditingController _usernameController = TextEditingController();
  final TextEditingController _passwordController = TextEditingController();

  void _login() {
    if (_usernameController.text.isEmpty || _passwordController.text.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Kripya Username aur Password darj karein!')),
      );
      return;
    }
    // Navigate to Market List
    Navigator.pushReplacement(
      context,
      MaterialPageRoute(
        builder: (context) => MarketListScreen(username: _usernameController.text),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Gaming Account Login / Signup'), backgroundColor: Colors.deepPurple, foregroundColor: Colors.white),
      body: Padding(
        padding: const EdgeInsets.all(20.0),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            const Icon(Icons.games, size: 80, color: Colors.deepPurple),
            const SizedBox(height: 20),
            const Text('Apna Gaming Account Banayein', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
            const SizedBox(height: 30),
            TextField(
              controller: _usernameController,
              decoration: const InputDecoration(labelText: 'Username / Mobile Number', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 15),
            TextField(
              controller: _passwordController,
              obscureText: true,
              decoration: const InputDecoration(labelText: 'Password', border: OutlineInputBorder()),
            ),
            const SizedBox(height: 20),
            ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.deepPurple, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(50)),
              onPressed: _login,
              child: const Text('Login / Register', style: TextStyle(fontSize: 16)),
            ),
          ],
        ),
      ),
    );
  }
}

// 2. MARKET LIST SCREEN (Kalyan, Time Bazar, Milan, etc.)
class MarketListScreen extends StatelessWidget {
  final String username;
  const MarketListScreen({super.key, required this.username});

  final List<Map<String, String>> markets = const [
    {"name": "Kalyan", "time": "04:00 PM - 06:00 PM"},
    {"name": "Time Bazar", "time": "01:00 PM - 03:00 PM"},
    {"name": "Milan Day", "time": "03:00 PM - 05:00 PM"},
    {"name": "Rajdhani Night", "time": "09:30 PM - 11:30 PM"},
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: Text('Welcome, $username'),
        backgroundColor: Colors.deepPurple,
        foregroundColor: Colors.white,
        actions: [
          IconButton(
            icon: const Icon(Icons.account_balance_wallet),
            onPressed: () {
              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Wallet Balance: ₹500')));
            },
          )
        ],
      ),
      body: ListView.builder(
        padding: const EdgeInsets.all(16),
        itemCount: markets.length,
        itemBuilder: (context, index) {
          return Card(
            elevation: 4,
            margin: const EdgeInsets.only(bottom: 15),
            child: ListTile(
              title: Text(markets[index]["name"]!, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
              subtitle: Text('Timing: ${markets[index]["time"]}'),
              trailing: ElevatedButton(
                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                onPressed: () {
                  Navigator.push(
                    context,
                    MaterialPageRoute(
                      builder: (context) => GamePlayScreen(marketName: markets[index]["name"]!),
                    ),
                  );
                },
                child: const Text('Play'),
              ),
            ),
          );
        },
      ),
    );
  }
}

// 3. GAMEPLAY SCREEN (Single, Jodi, Panel Selection & Amount)
class GamePlayScreen extends StatefulWidget {
  final String marketName;
  const GamePlayScreen({super.key, required this.marketName});

  @override
  State<GamePlayScreen> createState() => _GamePlayScreenState();
}

class _GamePlayScreenState extends State<GamePlayScreen> {
  String selectedGameType = "Single Digit";
  final TextEditingController _numberController = TextEditingController();
  final TextEditingController _amountController = TextEditingController();
  String resultStatus = "Bet submit hone par result yahan dikhega.";

  void _placeBet() {
    if (_numberController.text.isEmpty || _amountController.text.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Kripya number aur amount bharein!')));
      return;
    }

    // Mock Result Calculation logic
    setState(() {
      resultStatus = "Bet Successful! Market: ${widget.marketName}\nType: $selectedGameType\nNumber: ${_numberController.text}\nAmount: ₹${_amountController.text}\nStatus: Payout pending (Result aane par update hoga)";
    });

    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Bet Successfully Placed!')));
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: Text('${widget.marketName} Market'), backgroundColor: Colors.deepPurple, foregroundColor: Colors.white),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: SingleChildScrollView(
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              const Text('Game Type Chunein:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
              const SizedBox(height: 10),
              DropdownButtonFormField<String>(
                value: selectedGameType,
                decoration: const InputDecoration(border: OutlineInputBorder()),
                items: const [
                  DropdownMenuItem(value: "Single Digit", child: Text("Single Digit (0-9)")),
                  DropdownMenuItem(value: "Jodi", child: Text("Jodi (00-99)")),
                  DropdownMenuItem(value: "Panel / Panna", child: Text("Panel / Panna (3 Digits)")),
                ],
                onChanged: (value) {
                  setState(() {
                    selectedGameType = value!;
                  });
                },
              ),
              const SizedBox(height: 20),
              TextField(
                controller: _numberController,
                keyboardType: TextInputType.number,
                decoration: InputDecoration(
                  labelText: '$selectedGameType Number Daalein',
                  border: const OutlineInputBorder(),
                ),
              ),
              const SizedBox(height: 20),
              TextField(
                controller: _amountController,
                keyboardType: TextInputType.number,
                decoration: const InputDecoration(
                  labelText: 'Bet Amount (₹)',
                  border: OutlineInputBorder(),
                  prefixIcon: Icon(Icons.currency_rupee),
                ),
              ),
              const SizedBox(height: 25),
              ElevatedButton(
                style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, padding: const EdgeInsets.symmetric(vertical: 15)),
                onPressed: _placeBet,
                child: const Text('Submit Bet & Pay', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
              ),
              const SizedBox(height: 30),
              Container(
                padding: const EdgeInsets.all(15),
                decoration: BoxDecoration(color: Colors.yellow[100], borderRadius: BorderRadius.circular(8), border: Border.all(color: Colors.orange)),
                child: Column(
                  children: [
                    const Text('Live Payout / Result Track', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    const SizedBox(height: 10),
                    Text(resultStatus, textAlign: TextAlign.center, style: const TextStyle(fontSize: 14)),
                  ],
                ),
              )
            ],
          ),
        ),
      ),
    );
  }
}
